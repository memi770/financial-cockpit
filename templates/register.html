{% extends "base.html" %}
{% block content %}

<div class="d-flex justify-content-center align-items-center" style="height: 80vh;">
  <div class="card shadow p-4" style="width: 420px;">
    <h3 class="text-center mb-3">הרשמה</h3>

    {% if error %}
      <div class="alert alert-danger text-center">{{ error }}</div>
    {% elif success %}
      <div class="alert alert-success text-center">{{ success }}</div>
    {% endif %}

    <form method="post" action="/register" id="registerForm">

      <!-- Regular registration -->
      <div class="mb-3">
        <label class="form-label">שם משתמש</label>
        <input type="text" name="username" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">אימייל</label>
        <input type="email" name="email" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">סיסמה</label>
        <input type="password" name="password" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">אישור סיסמה</label>
        <input type="password" name="confirm_password" class="form-control" required>
      </div>

      <!-- Shared account toggle -->
      <div class="form-check form-switch mb-3">
        <input class="form-check-input" type="checkbox" id="isShared" name="is_shared">
        <label class="form-check-label fw-bold" for="isShared">
          אני רוצה ליצור או להצטרף לחשבון משותף
        </label>
      </div>

      <!-- Shared account details -->
      <div id="sharedSection" style="display:none;">

        <div class="alert alert-info small text-center mb-3">
          ניתן להצטרף לחשבון משותף קיים או ליצור חדש.
        </div>

        <div class="card p-3">
          <h6 class="text-center">הצטרפות לחשבון קיים</h6>
          <div class="mb-2">
            <label class="form-label">שם משתמש של השותף</label>
            <input type="text" name="partner_username" class="form-control" placeholder="לדוגמה: david123">
          </div>
          <div class="mb-2">
            <label class="form-label">סיסמת השותף</label>
            <input type="password" name="partner_password" class="form-control" placeholder="סיסמת השותף הקיים">
          </div>
          <div class="text-center my-2 text-muted">או</div>
          <h6 class="text-center">צור חשבון משותף חדש</h6>
          <div class="mb-2">
            <label class="form-label">שם לחשבון המשותף</label>
            <input type="text" name="shared_name" class="form-control" placeholder="לדוגמה: משפחת כהן">
          </div>
        </div>
      </div>

      <button type="submit" class="btn btn-success w-100 mt-3">הרשם</button>
    </form>

    <div class="text-center mt-3">
      <a href="/login">כבר יש לך חשבון? התחבר כאן</a>
    </div>
  </div>
</div>

<script>
document.getElementById("isShared").addEventListener("change", function() {
  document.getElementById("sharedSection").style.display = this.checked ? "block" : "none";
});

// ✅ Client-side validation before submit
document.getElementById("registerForm").addEventListener("submit", function(e) {
  const isShared = document.getElementById("isShared").checked;
  if (isShared) {
    const partnerUser = document.querySelector("[name='partner_username']").value.trim();
    const partnerPass = document.querySelector("[name='partner_password']").value.trim();
    const sharedName = document.querySelector("[name='shared_name']").value.trim();

    // If user checked shared option but left all 3 empty
    if (!partnerUser && !partnerPass && !sharedName) {
      e.preventDefault();
      alert("בחר אחת מהאפשרויות: הצטרפות לחשבון קיים או יצירת חשבון חדש.");
      return false;
    }

    // If user filled one of the partner fields but not both
    if ((partnerUser && !partnerPass) || (!partnerUser && partnerPass)) {
      e.preventDefault();
      alert("אם אתה מצטרף לחשבון קיים — יש להזין גם שם משתמש וגם סיסמה של השותף.");
      return false;
    }
  }
});
</script>

{% endblock %}
