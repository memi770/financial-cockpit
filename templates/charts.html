{% extends "base.html" %}
{% block content %}

<div class="container mt-4">

  <h2 class="mb-4">גרפים וניתוח נתונים</h2>

  <!-- ===================== PIE CHART CARD ===================== -->

  <div class="card shadow-sm p-3 mt-3">

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="form-section-title"> עוגת פילוח נתונים</h4>

    </div>

    <!-- פילטרים עצמאיים -->
    <div id="chartFilters"
         class="d-flex flex-wrap justify-content-center align-items-end gap-3">

      <div class="form-field">

          <label class="form-label">סוג התנועות</label>

          <select id="chartTransactionType" class="form-select">
              <option value="expense" selected>הוצאות</option>
              <option value="income">הכנסות</option>
          </select>

      </div>

      <div class="form-field">
        <label class="form-label">מתאריך</label>
        <input type="date" id="chartStartDate" class="form-control">
      </div>

      <div class="form-field">
        <label class="form-label">עד תאריך</label>
        <input type="date" id="chartEndDate" class="form-control">
      </div>

      {% if shared_id %}
      <div class="form-field">
        <label class="form-label">הוזן על ידי</label>
        <select id="chartCreatedBy" class="form-select">
          <option value="">הכל</option>
          {% for u in users %}
              <option value="{{ u.user_id }}">
                {{ u.username }}
              </option>
          {% endfor %}
        </select>
      </div>
      {% endif %}

      <div class="form-field">
        <label class="form-label">סוג</label>
        <select id="chartNature" class="form-select">
          <option value="">הכל</option>
          <option value="קבועה">קבועה</option>
          <option value="משתנה">משתנה</option>
        </select>
      </div>

    </div>

    <div class="form-actions">
        <button id="chartApply" type="button" class="btn btn-primary">
          סנן
        </button>

        <button id="chartReset" type="button"
                class="btn btn-outline-secondary" disabled>
          איפוס סינון
        </button>
    </div>

    <div id="plotlyChart" style="height:400px;"></div>

  </div>

  <!-- ===================== CASHFLOW CHART ===================== -->

  <div class="card shadow-sm p-3 mt-5">
    <h4 class="form-section-title">הוצאות מול הכנסות לפי חודשים</h4>
    <div class="d-flex flex-wrap justify-content-center align-items-end gap-3">

      <div class="form-field">
        <label class="form-label">מתאריך</label>
        <input type="date" id="cashflowStartDate" class="form-control">
      </div>

      <div class="form-field">
        <label class="form-label">עד תאריך</label>
        <input type="date" id="cashflowEndDate" class="form-control">
      </div>

      {% if shared_id %}
      <div class="form-field">
        <label class="form-label">הוזן על ידי</label>

        <select id="cashflowCreatedBy" class="form-select">
          <option value="">הכל</option>

          {% for u in users %}
            <option value="{{ u['user_id'] }}">
              {{ u['username'] }}
            </option>
          {% endfor %}
        </select>
      </div>
      {% endif %}

      <div class="form-actions">
        <button id="cashflowApply"
                class="btn btn-primary">
          סנן
        </button>
      </div>

    </div>
    <div id="cashflowChart" style="height:400px;"></div>
  </div>

</div>


<!-- ===================== SCRIPTS ===================== -->

<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

<script>

/* ===================== HELPERS ===================== */

function getCurrentMonthRange() {
  const today = new Date();
  const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);

  return {
    start: firstDay.toISOString().split("T")[0],
    end: today.toISOString().split("T")[0]
  };
}


/* ===================== PIE CHART ===================== */

function generatePie(data) {

  const selectedType =
    document.getElementById("chartTransactionType").value;

  const categories = {};

  data.forEach(t => {
    if (t.type !== selectedType) return;

    categories[t.category || "אחר"] =
      (categories[t.category || "אחר"] || 0) + Math.abs(t.amount);
  });

  if (Object.keys(categories).length === 0) {
    Plotly.newPlot("plotlyChart", [], {
      annotations: [{
        text: "אין נתונים",
        showarrow: false
      }]
    });
    return;
  }

  Plotly.newPlot("plotlyChart", [{
    type: "pie",
    labels: Object.keys(categories),
    values: Object.values(categories)
  }]);
}


/* ===================== CASHFLOW ===================== */

function generateCashflow(data) {

  const monthly = {};

  data.forEach(t => {
    const month = t.date.substring(0, 7);

    if (!monthly[month]) {
      monthly[month] = { income: 0, expense: 0 };
    }

    if (t.type === "income") {
      monthly[month].income += t.amount;
    } else {
      monthly[month].expense += Math.abs(t.amount);
    }
  });

  const months = Object.keys(monthly).sort();

  const incomeValues = months.map(m => monthly[m].income);
  const expenseValues = months.map(m => monthly[m].expense);

  Plotly.newPlot("cashflowChart", [
    { x: months, y: incomeValues, type: "bar", name: "הכנסות" },
    { x: months, y: expenseValues, type: "bar", name: "הוצאות" }
  ]);
}


/* ===================== FETCH ===================== */

function fetchChartData() {

  const start =
    document.getElementById("chartStartDate").value;

  const end =
    document.getElementById("chartEndDate").value;

  const createdBy =
    document.getElementById("chartCreatedBy")?.value || "";

  const nature =
    document.getElementById("chartNature")?.value || "";

  const transactionType =
    document.getElementById("chartTransactionType").value;

  const url =
    `/get_chart_data?start_date=${start}&end_date=${end}` +
    `&created_by=${createdBy}` +
    `&nature=${nature}` +
    `&type=${transactionType}`;

  fetch(url)
    .then(r => r.json())
    .then(data => {
      generatePie(data);
    });
}


function fetchCashflowData() {

  const start =
    document.getElementById("cashflowStartDate").value;

  const end =
    document.getElementById("cashflowEndDate").value;

  const createdBy =
    document.getElementById("cashflowCreatedBy")?.value || "";

  const url =
    `/get_cashflow_data?start_date=${start}` +
    `&end_date=${end}` +
    `&created_by=${createdBy}`;

  fetch(url)
    .then(r => r.json())
    .then(data => {
      generateCashflow(data);
    });
}

/* ===================== INIT ===================== */

document.addEventListener("DOMContentLoaded", () => {

  const { start, end } = getCurrentMonthRange();

  document.getElementById("chartStartDate").value = start;
  document.getElementById("chartEndDate").value = end;

  document.getElementById("cashflowStartDate").value = start;
  document.getElementById("cashflowEndDate").value = end;

  // EVENTS
  document
    .getElementById("chartApply")
    .addEventListener("click", fetchChartData);

  document
    .getElementById("chartReset")
    .addEventListener("click", () => {
      const { start, end } = getCurrentMonthRange();

      document.getElementById("chartStartDate").value = start;
      document.getElementById("chartEndDate").value = end;

      document.getElementById("chartNature").value = "";
      document.getElementById("chartTransactionType").value = "expense";

      fetchChartData();
    });

  document
    .getElementById("chartTransactionType")
    .addEventListener("change", fetchChartData);

  // CASHFLOW EVENT
  document
    .getElementById("cashflowApply")
    .addEventListener("click", fetchCashflowData);

  // INIT LOAD
  fetchChartData();
  fetchCashflowData();
});

</script>

{% endblock %}
